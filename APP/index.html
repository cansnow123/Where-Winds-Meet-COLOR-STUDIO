<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102f2b">
  <meta name="description" content="燕云十六声移动端彩字生成工具">
  <title>燕云彩字</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="apple-touch-icon" href="./logo.svg">
  <link rel="stylesheet" href="./styles.css?v=20260916.2">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#editor" aria-label="燕云彩字首页">
        <img src="./logo.svg" alt="" class="brand-mark">
        <span>
          <small>YANYUN COLOR STUDIO</small>
          <strong>燕云彩字</strong>
        </span>
      </a>
      <div class="topbar-actions" aria-label="文案操作">
        <button id="loadSampleBtn" class="icon-button" type="button" title="载入示例" aria-label="载入示例">示例</button>
        <button id="saveDraftBtn" class="icon-button" type="button" title="保存草稿" aria-label="保存草稿">保存</button>
        <button id="clearEditorBtn" class="icon-button danger" type="button" title="清空文案" aria-label="清空文案">清空</button>
      </div>
      <ol class="topbar-flow" aria-label="使用步骤">
        <li><b>1</b><span>输入</span></li>
        <li><b>2</b><span>框选</span></li>
        <li><b>3</b><span>上色</span></li>
        <li><b>4</b><span>复制</span></li>
      </ol>
    </header>

    <main>
      <section class="color-section" aria-labelledby="color-title">
        <div class="section-heading">
          <div>
            <p class="kicker">第二步</p>
            <h2 id="color-title">选色</h2>
          </div>
          <span class="current-color"><i></i><strong id="currentColorDisplay">#ff6a3d</strong></span>
        </div>

        <div class="swatch-section">
          <div class="label-row"><span>快捷色</span><small>选中文字后可直接点选</small></div>
          <div id="presetSwatches" class="swatch-row" aria-label="快捷颜色"></div>
        </div>

        <div class="mode-tabs" id="modeTabs" role="tablist" aria-label="上色模式">
          <button id="modeTab-single" class="mode-tab is-active" data-mode="single" type="button" role="tab" aria-selected="true" aria-controls="modePanel-single">单色</button>
          <button id="modeTab-gradient" class="mode-tab" data-mode="gradient" type="button" role="tab" aria-selected="false" aria-controls="modePanel-gradient" tabindex="-1">双渐变</button>
          <button id="modeTab-multi" class="mode-tab" data-mode="multi" type="button" role="tab" aria-selected="false" aria-controls="modePanel-multi" tabindex="-1">多色</button>
        </div>

        <div class="mode-panel-wrap">
          <section id="modePanel-single" class="mode-panel is-active" data-mode-panel="single" role="tabpanel" aria-labelledby="modeTab-single">
            <div class="single-controls">
              <label class="color-input-wrap" title="选择单色">
                <span>颜色</span>
                <input id="singleColorInput" type="color" value="#ff6a3d" aria-label="选择单色">
              </label>
              <label class="hex-field">
                <span>HEX</span>
                <input id="singleHexInput" type="text" value="#ff6a3d" inputmode="text" autocapitalize="off" spellcheck="false" aria-label="单色十六进制值">
              </label>
            </div>
          </section>

          <section id="modePanel-gradient" class="mode-panel" data-mode-panel="gradient" role="tabpanel" aria-labelledby="modeTab-gradient" hidden>
            <div class="gradient-controls">
              <label class="gradient-swatch-wrapper" title="选择起始色">
                <span class="color-swatch" data-target="gradientStartInput" style="background:#ff6a3d" aria-hidden="true"></span>
                <input id="gradientStartInput" class="gradient-picker" type="color" value="#ff6a3d" aria-label="选择起始色">
              </label>
              <span class="swatch-arrow" aria-hidden="true">&rarr;</span>
              <label class="gradient-swatch-wrapper" title="选择结束色">
                <span class="color-swatch" data-target="gradientEndInput" style="background:#ffd166" aria-hidden="true"></span>
                <input id="gradientEndInput" class="gradient-picker" type="color" value="#ffd166" aria-label="选择结束色">
              </label>
              <div id="gradientStrip" class="gradient-strip" aria-hidden="true"></div>
            </div>
          </section>

          <section id="modePanel-multi" class="mode-panel" data-mode-panel="multi" role="tabpanel" aria-labelledby="modeTab-multi" hidden>
            <div id="paletteSwatches" class="swatch-grid" aria-label="多色渐变颜色"></div>
            <div class="palette-caption"><span>平滑经过 <b id="paletteCount">0</b> 种颜色</span><span>点击色块更换</span></div>
            <div id="paletteStrip" class="gradient-strip" aria-hidden="true"></div>
          </section>
        </div>

        <div class="apply-actions" aria-label="上色操作">
          <button id="applySelectionBtn" class="primary-button" type="button">给选中内容上色</button>
          <button id="applyAllBtn" class="secondary-button" type="button">整段套用</button>
          <button id="clearSelectionStyleBtn" class="text-button" type="button">清除选中颜色</button>
          <button id="resetAllStylesBtn" class="text-button" type="button">全部恢复默认</button>
        </div>
      </section>

      <section class="editor-section" id="editor" aria-labelledby="editor-title">
        <div class="section-heading">
          <div>
            <p class="kicker">第一步</p>
            <h2 id="editor-title">文案</h2>
          </div>
          <span id="selectionHint" class="selection-hint" role="status" aria-live="polite" aria-atomic="true">未选中文字</span>
        </div>
        <div id="richEditor" class="rich-editor" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" inputmode="text" enterkeyhint="enter" aria-label="彩字可视编辑区" aria-describedby="editorNote"></div>
        <p id="editorNote" class="editor-note">支持粘贴和换行，颜色会保留在实时预览中。</p>
        <div class="composer-result" aria-label="彩字结果">
          <div class="composer-result-row">
            <div class="stats" id="stats" aria-label="彩字统计"></div>
            <button id="copyExportBtn" class="copy-button" type="button">复制彩字</button>
          </div>
          <details class="tag-drawer">
            <summary>查看标签代码</summary>
            <textarea id="exportOutput" readonly spellcheck="false" aria-label="最终可复制代码"></textarea>
          </details>
          <p id="status" class="status-text" role="status" aria-live="polite" aria-atomic="true">准备就绪。</p>
        </div>
        <div id="preview" hidden aria-hidden="true"></div>
      </section>

    </main>
  </div>
  <script src="./app.js?v=20260916.2" type="module"></script>
</body>
</html>
