<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b28">
  <meta name="robots" content="noindex">
  <title>迷途未远 | 燕云十六声 彩字工坊</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="stylesheet" href="./404.css?v=20260917.1">
</head>
<body>
  <main class="lost-page">
    <div class="atmosphere" aria-hidden="true">
      <span class="moon"></span>
      <span class="mist mist-one"></span>
      <span class="mist mist-two"></span>
      <span class="wind wind-one"></span>
      <span class="wind wind-two"></span>
      <span class="mountain mountain-far"></span>
      <span class="mountain mountain-near"></span>
      <span class="ridge ridge-left"></span>
      <span class="ridge ridge-right"></span>
    </div>

    <header class="site-mark">
      <a href="./" aria-label="返回燕云十六声彩字工坊首页">
        <img src="./logo.svg" alt="" width="42" height="42">
        <span>
          <small>WHERE WINDS MEET</small>
          <strong>燕云彩字工坊</strong>
        </span>
      </a>
    </header>

    <section class="error-content" aria-labelledby="lost-title">
      <p class="chapter">卷 外 &nbsp;|&nbsp; 迷途</p>
      <div class="error-number" aria-label="错误代码 404">404</div>
      <h1 id="lost-title">此处山高路远</h1>
      <p class="message">风把来路吹散了。你要找的这一页，未在燕云的舆图之中。</p>
      <a class="return-link" href="./">
        <span>回到彩字工坊</span>
        <span class="arrow" aria-hidden="true">&#8594;</span>
      </a>
    </section>

    <aside class="waypoint" aria-label="江湖箴言">
      <span class="waypoint-line"></span>
      <p>路虽远，行则将至</p>
      <span class="waypoint-line"></span>
    </aside>

    <div class="seal" aria-hidden="true"><span>迷<br>途</span></div>
    <p class="footer-note">YANYUN COLOR STUDIO &nbsp;&middot;&nbsp; 404</p>
  </main>

</html>
